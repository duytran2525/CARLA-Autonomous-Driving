# Reproducible counterfactual NPC-response experiment with pinned coordinates.
experiment:
  host: "127.0.0.1"
  port: 2000
  tm_port: 8000
  timeout_s: 60.0
  town: "Town03"
  expected_server_version_prefix: "0.9.16"
  fixed_delta_s: 0.05
  no_rendering: true
  base_seed: 41021
  repetitions: 10
  run_duration_s: 14.0
  warmup_ticks: 20
  reload_world_each_run: true
  output_dir: "outputs/ego_intent_response"
  catalog_path: "configs/ego_intent_response_town03_scenes.yaml"
  initial_position_tolerance_m: 0.10
  initial_speed_tolerance_mps: 0.25
  initial_yaw_tolerance_deg: 0.5
  max_setup_attempts: 2
  tm_following_distance_m: 4.0
  reactive_min_ttc_s: 3.0
  reactive_occupancy_radius_m: 6.0
  reactive_follow_gap_m: 10.0
